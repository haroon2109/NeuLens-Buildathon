<!doctype html>
<!-- lang is updated at runtime by LanguageManager when the patient picks a language -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/neulens-mark.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/neulens-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Optimization -->
    <meta name="theme-color" content="#FBF7EF" />
    <title>NeuLens — Earlier Brain Health Screening for Clinicians</title>
    <meta name="description" content="NeuLens combines cognitive, ocular, vocal and facial observations into a structured, clinician-supervised brain-health screening session with personal baselines and longitudinal review." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NeuLens — Understand Brain Health. Identify Changes Earlier." />
    <meta property="og:description" content="A developing prototype for multimodal brain-health screening and clinical decision support. Request a clinical demo or research collaboration." />
    
    <!-- Font Preconnections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope is Latin-only. The Indic families below are what the six
         supported languages actually render in; Google Fonts serves each with
         its own unicode-range, so a script is only downloaded when it appears
         on screen. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
